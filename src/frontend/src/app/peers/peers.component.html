<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Name</th><th>Public Key</th><th>IPv4</th><th>IPv6</th><th>Expires</th><th>QR Code</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (peer of peers(); track peer.public_key) {
        <tr>
          <td class="w-40">
            <input
              class="input"
              [value]="displayName(peer)"
              (blur)="rename(peer, $any($event.target).value)"
              (keyup.enter)="$any($event.target).blur()"
            />
          </td>
          <td class="w-32">
            <div class="flex justify-center gap-2">
              <button class="btn btn-sm" (click)="copyKey(peer.public_key)">
                {{ copiedKey === peer.public_key ? '✓ Copied' : '📋 Copy' }}
              </button>
              <button class="btn btn-sm" (click)="viewKey(peer.public_key)">👁 View</button>
            </div>
          </td>
          <td class="font-mono text-xs">{{ peer.ipv4_address }}</td>
          <td class="font-mono text-xs">{{ peer.ipv6_address }}</td>
          <td>{{ peer.expires_at?.split('T')[0] || 'N/A' }}</td>
          <td class="w-20">
            <qrcode
              class="mx-auto block h-20 w-20 cursor-pointer"
              [qrdata]="makeCfg(peer)"
              [width]="80"
              [errorCorrectionLevel]="'M'"
              (click)="openQr(peer)">
            </qrcode>
          </td>
          <td class="w-32">
            <div class="flex flex-col items-center gap-2">
              <button class="btn w-28" (click)="download(peer)">Download</button>
              <button class="btn btn-danger w-28" (click)="remove(peer.public_key)">Delete</button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="7" class="py-8 text-center text-slate-500 dark:text-slate-400">
            No peers yet -- add one to get started.
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

@if (viewedKey()) {
  <div class="modal-backdrop" (click)="closeKeyModal()">
    <div class="modal-content max-w-md" (click)="$event.stopPropagation()">
      <h3 class="mb-3 text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Public Key</h3>
      <p class="break-all font-mono text-sm">{{ viewedKey() }}</p>
    </div>
  </div>
}

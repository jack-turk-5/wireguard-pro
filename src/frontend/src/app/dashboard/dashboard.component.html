<div class="mb-4 flex justify-end gap-2">
  <button class="btn" (click)="theme.toggle()">
    {{ theme.isDark() ? '☀️ Light Mode' : '🌙 Dark Mode' }}
  </button>
  <button class="btn" (click)="logout()">
    🔒 Logout
  </button>
</div>

<div class="card mb-6 flex flex-wrap justify-center gap-x-8 gap-y-2 text-center">
  <div>
    <p class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">Uptime</p>
    <p class="font-medium">{{ uptime }}</p>
  </div>
  <div>
    <p class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">Load Average</p>
    <p class="font-medium">{{ loadAvg }}</p>
  </div>
</div>

<section class="mb-6">
  <div class="mb-3 flex items-center justify-between">
    <h2 class="text-lg">Peers</h2>
    <button class="btn btn-primary" (click)="addPeer()">+ Add Peer</button>
  </div>
  <app-peers (qrClick)="onQrClick($event)" (peerDeleted)="onPeerChange()"></app-peers>
</section>

<section>
  <div class="mb-3 flex items-center justify-between">
    <h2 class="text-lg">Live Peer Stats</h2>
    <button class="btn" (click)="refreshStats()">Refresh Now</button>
  </div>
  <app-stats></app-stats>
</section>

@if (zoomedQr()) {
  <div class="modal-backdrop" (click)="closeQr()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <qrcode
        [qrdata]="zoomedQr()!"
        [width]="300"
        [errorCorrectionLevel]="'M'">
      </qrcode>
    </div>
  </div>
}
